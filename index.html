<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#101820" />
    <meta name="description" content="Editor y simulador de planta industrial 3D" />
    <title>Planta Viva — Editor 3D</title>
    <link rel="icon" href="data:," />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
        }
      }
    </script>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101820; }
      body { color: #e8f0f2; }
      #app { width: 100%; height: 100%; position: relative; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      .topbar { position: absolute; z-index: 2; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; pointer-events: none; }
      .brand, .toolbar button, .toolbar select, .hint, #data-panel, #status { border: 1px solid #ffffff1c; background: #101820ed; box-shadow: 0 8px 24px #0005; backdrop-filter: blur(12px); }
      .brand { border-radius: 12px; padding: 10px 14px; font-size: 14px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
      .brand span { color: #53d6a4; }
      .toolbar { display: flex; gap: 8px; pointer-events: auto; }
      .toolbar button, .toolbar select { color: #e8f0f2; border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 13px; }
      .toolbar button { cursor: pointer; }
      .toolbar button:active { background: #29413e; }
      .toolbar select { max-width: 180px; }
      .hint { position: absolute; z-index: 2; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); max-width: calc(100% - 24px); padding: 10px 14px; border-radius: 12px; color: #c4d2d5; font-size: 12px; text-align: center; white-space: nowrap; }
      #status { position: absolute; z-index: 2; top: 68px; left: 12px; padding: 8px 11px; border-radius: 10px; color: #b6f4d8; font-size: 12px; pointer-events: none; }
      #data-panel { display: none; position: absolute; z-index: 3; inset: 108px 12px 64px; padding: 14px; border-radius: 12px; overflow: auto; color: #b6f4d8; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
      #data-panel.open { display: block; }
      @media (max-width: 560px) {
        .topbar { align-items: flex-start; flex-wrap: wrap; }
        .brand { padding: 8px 10px; font-size: 12px; }
        .toolbar { margin-left: auto; gap: 5px; }
        .toolbar button, .toolbar select { padding: 8px 9px; font-size: 11px; }
        .toolbar select { max-width: 130px; }
        #status { top: 54px; }
        #data-panel { inset: 94px 12px 64px; }
        .hint { font-size: 10px; white-space: normal; }
      }
    </style>
  </head>
  <body>
    <main id="app" aria-label="Editor de planta industrial 3D">
      <header class="topbar">
        <div class="brand"><span>PLANTA</span> VIVA <small>· Fase 1</small></div>
        <nav class="toolbar" aria-label="Herramientas">
          <select id="component-type" aria-label="Familia de componente"></select>
          <button id="add-component" type="button">＋ Colocar</button>
          <button id="toggle-data" type="button" aria-label="Mostrar u ocultar datos">JSON</button>
        </nav>
      </header>
      <div id="status" role="status">Elige una familia y toca el plano para colocarla.</div>
      <div id="data-panel" aria-live="polite"></div>
      <div class="hint">Arrastra para orbitar · Pellizca para zoom · Toca para colocar · Los puertos compatibles se acoplan</div>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
